handoff:
  next_skill: plan-work
  epic: e08-vila-recycling-and-wheel-scenes
  epic_wsjf: 6.1
  first_story: e08s01
  context: 'e07 (bedroom + celebration) is closed: v0.9.0 released from main, the
    capsule is archived, and the post-epic review closed 18 findings. The next epic
    by WSJF is e08 (vila + roda). Its capsule is BOILERPLATE — generic goals, one
    generic AC list, and three template tasks per story with placeholder verify
    commands (exactly what e07s01..s04 looked like before plan-work rewrote them).
    Run plan-work first: write real acceptance criteria, a frozen contract and test
    scenarios per story, then build-epic.'
  open_decisions:
  - 'The celebration shows no reward: IMPACT_LATEST planned a "reward reveal" and
    e07s02 froze a scene without one. BUG-031 has the proposed story and the art
    (moedinha.png, estrela.png already ship); pairing it with the deferred HOLD_SEC
    (ADR-009 2) is what makes the party legible. Do not bolt it onto a released epic.'
  - 'No bedtime voice line exists in game/assets/audio/voice/. The bedroom answers with
    SFX (BUG-020). Add celebrate/sleep lines when the family records them — never TTS.'
  - 'ProgressManager.dress() has one caller (ClosetScene), so the bedroom and the
    celebration show the neutral rig. A story in e09/e10 territory (album/party) is the
    honest home for dressing every room (ADR-009 4).'
  - 'The care cycle reward is guarded once per cycle PER SESSION (in-memory ledger).
    A persisted guard would need a SaveData schema change; ADR-009 1 explains why it
    was not done for a path that does not exist outside tests.'
  - 'Benchmark divergences are deliberate and recorded in TEST_PLAN section 4: our
    120 px hit-target floor and 36 px insets are stricter than the five measured TutoTOONS
    titles (76-96 px chrome, 7-19 px insets). A review that asks us to align downward
    is wrong.'
  - 'Branch protection and repository rulesets return 403 on this private repo (needs
    GitHub Pro). Mitigation: harness blocks direct main commits; land through PRs
    with required check ''gate'' manually enforced until the plan is upgraded or the
    repo is made public.'
  - 'Version delivered by CI is only meaningful on main: big-release silently no-ops
    when HEAD is not a configured release branch.'
  - 'Hero-scale contract: DECIDED — the ratio on the opaque character is the requirement,
    the px figures in DESIGN section 3 are per-canvas illustrations. `QuiQuiRig` fits
    the box to the opaque art, so box height == painted height at rest.'
  - 'CONVENTIONS section 5 now states the 300-line/20-line bar with five grandfathered
    files named as debt (quiqui_rig 427, test_quiqui_rig 404, ci-cd.yml 341,
    touch_draggable 331, banheiro 326). Growing one is a violation.'
  - 'Regenerate specs/tech-architecture/COVERAGE_MAP_LATEST.md and HOTSPOTS_LATEST.md
    at every epic close (BUG-034); they were two epics behind before this pass.'
gate_decisions:
- gate: build-epic step 0 (threat model)
  decision: completed the draft e07 model written by the adoption audit and closed
    all six findings in-story
  reason: a draft is not a model; the reward path became reachable for the first time
    in e07
- gate: verify-work / audit-code
  decision: PASS after fixing request_scene from 26 to 21 lines (split into _park
    and _close_celebrate_for_detour)
  reason: the project's 20-line bar, enforced in every previous epic
- gate: request-review (dual-blind, 2 reviewers)
  decision: responded to all 3 must-fixes instead of merging; re-ran the gate
  reason: both reviewers independently found the same data-loss bug; a red review
    is a red gate
- gate: post-epic review (standing approval — recommended path, no prompt)
  decision: fixed every finding with a real defect behind it on ONE review branch
    (fix/e07-postepic-review), one conventional commit per finding; did not merge,
    push, tag or open a PR
  reason: the brief grants standing approval to take the recommended path at
    checkpoints, and merging/outward-facing actions stay forbidden without asking
- gate: post-epic review — reviewer A should-fix 2 (Casa whitelisted from the detour
    guard)
  decision: fixed by making CasaScene close the cycle on arrival AND moving the guard
    after request validation, instead of removing the whitelist
  reason: the hub is the cycle's own closure target; the defect was that nothing owned
    the arrival side, and both halves are now tested
- gate: post-epic review — BUG-031 (the celebration has no reward reveal)
  decision: DEFERRED, recorded in ADR-009 6 and specs/bugs/BUG-031
  reason: implementing it changes e07s02's frozen scene contract and acceptance
    criteria, which the brief names as a stop condition
- gate: post-epic review — celebration dwell (one fade) and rig dressing outside the
    closet
  decision: DEFERRED with reasons in ADR-009 2 and 4
  reason: product calls that change ACs or belong to another epic's slice; recorded,
    not silently skipped
- gate: post-epic review — 300-line bar breach found in test_casa_scene.gd (349)
  decision: split the suite by subject rather than delete assertions; promoted the
    bar into CONVENTIONS section 5 with the five pre-existing files named as debt
  reason: an unwritten rule is read differently by every audit (it already was);
    refactoring quiqui_rig.gd (427) inside a review pass is a separate story
decisions:
- id: ADR-001
  summary: Table-driven Fsm (res://scripts/core/fsm.gd) required for all state machines;
    boolean flag clusters banned.
- id: ADR-002
  summary: 1920x1080 canvas_items + expand aspect; 100% Control scene roots (PRESET_FULL_RECT)
    for zero letterbox bars on 4:3 iPad.
- id: ADR-003
  summary: QuiQuiRig separates Control layout box from foot-pivoted Node2D rig and
    layers Outfit under ExpressionOverlay so outfits never hide facial expressions.
- id: ADR-004
  summary: 'Unified TouchDraggable (4 modes: CONSUME_ON_DROP, CONTINUOUS_SCRUB, SNAP_TO_SLOT,
    FREE_PLACEMENT) with device==-1 mouse-echo filtering.'
- id: ADR-005
  summary: Typed SaveData Resource with atomic .tmp rename and mandatory TestReset
    isolation (user://test_progress.json).
- id: ADR-006
  summary: 'Scene-by-Scene Vertical Slicing: Every epic (e01..e11) ends with at least
    one bootable, playable, end-to-end tested scene.'
- id: ADR-007
  summary: Centralised CI/CD (one self-contained workflow, ci-lint -> test -> verify
    -> build -> export -> release) and big-release for the version ladder.
- id: ADR-008
  summary: Edge-anchored responsive composition — anchors are canvas ratios, offsets
    are absolute pixels; GeometryOracle asserts the painted character, not the box.
- id: ADR-009
  summary: 'Care cycle: money is owned once by CareLoopManager (per-session ledger,
    no persisted guard); the short celebration, the missing bedtime voice line, rig
    dressing outside the closet, the per-scene helper twins and the missing reward
    reveal are recorded decisions, not silent gaps.'
