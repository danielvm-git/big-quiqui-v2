  open_decisions:
  - 'INV-07 allows numerals in Labels (the store prices) and forbids words: a pre-reader never
    parses a digit, and the coin icon plus the sold badge carry the meaning. TEST_PLAN section 3
    row 6 ("no text node carries play meaning") is the stricter reading; the gate implements the
    operable one. A review that wants zero Labels must change the store design first.'
  - 'The save still has no backup file (FIX-06): a corrupt progress.json degrades to defaults.
    now covered by a test (BUG-055 makes the degradation total), so the loss is survivable
    rather than silent. The .bak path is still e11s04 hardening.'
  - No bedtime voice line exists in game/assets/audio/voice/. The bedroom answers
    with SFX (BUG-020). Add celebrate/sleep lines when the family records them — never
    TTS.
  - ProgressManager.dress() has one caller (ClosetScene), so the bedroom and the celebration
    show the neutral rig. A story in e09/e10 territory (album/party) is the honest
    home for dressing every room (ADR-009 4).
  - The care cycle reward is guarded once per cycle PER SESSION (in-memory ledger).
    A persisted guard would need a SaveData schema change; ADR-009 1 explains why
    it was not done for a path that does not exist outside tests.
  - 'Benchmark divergences are deliberate and recorded in TEST_PLAN section 4: our
    120 px hit-target floor and 36 px insets are stricter than the five measured TutoTOONS
    titles (76-96 px chrome, 7-19 px insets). A review that asks us to align downward
    is wrong.'
  - 'Branch protection and repository rulesets return 403 on this private repo (needs
    GitHub Pro). Mitigation: harness blocks direct main commits; land through PRs
    with required check ''gate'' manually enforced until the plan is upgraded or the
    repo is made public.'
  - 'Version delivered by CI is only meaningful on main: big-release silently no-ops
    when HEAD is not a configured release branch.'
  - 'Hero-scale contract: DECIDED — the ratio on the opaque character is the requirement,
    the px figures in DESIGN section 3 are per-canvas illustrations. `QuiQuiRig` fits
    the box to the opaque art, so box height == painted height at rest.'
  - CONVENTIONS section 5 now states the 300-line/20-line bar with five grandfathered
    files named as debt (quiqui_rig 427, test_quiqui_rig 404, ci-cd.yml 341, touch_draggable
    331, banheiro 326). Growing one is a violation.
  - Regenerate specs/tech-architecture/COVERAGE_MAP_LATEST.md and HOTSPOTS_LATEST.md
    at every epic close (BUG-034); they were two epics behind before this pass.
  - 'TutoTOONS engine deep pass (REA, 24 titles, 2026-11-06) refuted the Adobe-AIR
    claim in TUTOTOONS_REFERENCE.md: all 24 installed titles are Unity IL2CPP, Dopples
    World + Fluvsies are Unity 6 (6000.0.71f1), the rest 2022.3.62f2. Reference doc
    corrected; details in specs/product/TUTOTOONS_ENGINE_REPORT.md.'
  - 'Parity backlog adopted: specs/product/QUIQUI2_TUTOTOONS_PARITY_BACKLOG.md lists
    FIX-01..FIX-09 mapped to e08-e11 (wish escalation, hint layer, reward juice, badges,
    tuning tables, save backup, dev console; haptics declined). ~14-15 BCP front-loaded
    into e08.'
  - The ghost-hand affordance deferred in TUTOTOONS_REFERENCE.md is now specified
    as FIX-02 (HintManager + PulsatingHint + DragHint) and debuts in e08s02, not e04.
  - 'e08 POI layout: six building taps (CASA, RODA, MERCADO, CASINHA, FESTA) plus
    a separate recycle bag/bin hit pair — recycling is the drag verb, not a seventh
    TapButton POI.'
