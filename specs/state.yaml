handoff:
  next_skill: kickoff-branch
  epic: e08-vila-recycling-and-wheel-scenes
  epic_wsjf: 6.1
  first_story: e08s01
  context: 'e08 plan-work opened: e08s01 (VilaScene + FIX-01 wish escalation) and
    e08s02 (recycling + FIX-02 hint layer + FIX-03 reward juice) now have real acceptance
    criteria, frozen contracts and test scenarios; plan-consistency-check PASS. e08s03
    (wheel) and e08s04 (economy properties) are still boilerplate — plan-work them
    before build-epic. One open decision: the exact 6-POI set in e08s01 (proposed
    casa/roda/recycling/mercado/casinha/festa). Next: kickoff-branch for e08s01.'
  open_decisions:
  - No bedtime voice line exists in game/assets/audio/voice/. The bedroom answers
    with SFX (BUG-020). Add celebrate/sleep lines when the family records them — never
    TTS.
  - ProgressManager.dress() has one caller (ClosetScene), so the bedroom and the celebration
    show the neutral rig. A story in e09/e10 territory (album/party) is the honest
    home for dressing every room (ADR-009 4).
  - The care cycle reward is guarded once per cycle PER SESSION (in-memory ledger).
    A persisted guard would need a SaveData schema change; ADR-009 1 explains why
    it was not done for a path that does not exist outside tests.
  - 'Benchmark divergences are deliberate and recorded in TEST_PLAN section 4: our
    120 px hit-target floor and 36 px insets are stricter than the five measured TutoTOONS
    titles (76-96 px chrome, 7-19 px insets). A review that asks us to align downward
    is wrong.'
  - 'Branch protection and repository rulesets return 403 on this private repo (needs
    GitHub Pro). Mitigation: harness blocks direct main commits; land through PRs
    with required check ''gate'' manually enforced until the plan is upgraded or the
    repo is made public.'
  - 'Version delivered by CI is only meaningful on main: big-release silently no-ops
    when HEAD is not a configured release branch.'
  - 'Hero-scale contract: DECIDED — the ratio on the opaque character is the requirement,
    the px figures in DESIGN section 3 are per-canvas illustrations. `QuiQuiRig` fits
    the box to the opaque art, so box height == painted height at rest.'
  - CONVENTIONS section 5 now states the 300-line/20-line bar with five grandfathered
    files named as debt (quiqui_rig 427, test_quiqui_rig 404, ci-cd.yml 341, touch_draggable
    331, banheiro 326). Growing one is a violation.
  - Regenerate specs/tech-architecture/COVERAGE_MAP_LATEST.md and HOTSPOTS_LATEST.md
    at every epic close (BUG-034); they were two epics behind before this pass.
  - 'TutoTOONS engine deep pass (REA, 24 titles, 2026-11-06) refuted the Adobe-AIR
    claim in TUTOTOONS_REFERENCE.md: all 24 installed titles are Unity IL2CPP, Dopples
    World + Fluvsies are Unity 6 (6000.0.71f1), the rest 2022.3.62f2. Reference doc
    corrected; details in specs/product/TUTOTOONS_ENGINE_REPORT.md.'
  - 'Parity backlog adopted: specs/product/QUIQUI2_TUTOTOONS_PARITY_BACKLOG.md lists
    FIX-01..FIX-09 mapped to e08-e11 (wish escalation, hint layer, reward juice, badges,
    tuning tables, save backup, dev console; haptics declined). ~14-15 BCP front-loaded
    into e08.'
  - The ghost-hand affordance deferred in TUTOTOONS_REFERENCE.md is now specified
    as FIX-02 (HintManager + PulsatingHint + DragHint) and debuts in e08s02, not e04.
gate_decisions:
- gate: build-epic step 0 (threat model)
  decision: completed the draft e07 model written by the adoption audit and closed
    all six findings in-story
  reason: a draft is not a model; the reward path became reachable for the first time
    in e07
- gate: verify-work / audit-code
  decision: PASS after fixing request_scene from 26 to 21 lines (split into _park
    and _close_celebrate_for_detour)
  reason: the project's 20-line bar, enforced in every previous epic
- gate: request-review (dual-blind, 2 reviewers)
  decision: responded to all 3 must-fixes instead of merging; re-ran the gate
  reason: both reviewers independently found the same data-loss bug; a red review
    is a red gate
- gate: post-epic review (standing approval — recommended path, no prompt)
  decision: fixed every finding with a real defect behind it on ONE review branch
    (fix/e07-postepic-review), one conventional commit per finding; did not merge,
    push, tag or open a PR
  reason: the brief grants standing approval to take the recommended path at checkpoints,
    and merging/outward-facing actions stay forbidden without asking
- gate: post-epic review — reviewer A should-fix 2 (Casa whitelisted from the detour
    guard)
  decision: fixed by making CasaScene close the cycle on arrival AND moving the guard
    after request validation, instead of removing the whitelist
  reason: the hub is the cycle's own closure target; the defect was that nothing owned
    the arrival side, and both halves are now tested
- gate: post-epic review — BUG-031 (the celebration had no reward reveal and lasted
    one fade)
  decision: FIXED — the party holds 1.8 s and pops in a coin + a ticket at the head
    line; the frozen e07s02 contract and acceptance criteria are updated to match
  reason: on reflection a payoff scene that ends in one fade is a defect, not a product
    call; the "stop condition" reading was too conservative for a review pass
- gate: post-epic review — rig dressing outside the closet
  decision: DEFERRED with the reason in ADR-009 4
  reason: belongs to another epic's slice (album/party), where the celebration is
    where she looks at herself
- gate: post-epic review — 300-line bar breach found in test_casa_scene.gd (349)
  decision: split the suite by subject rather than delete assertions; promoted the
    bar into CONVENTIONS section 5 with the five pre-existing files named as debt
  reason: an unwritten rule is read differently by every audit (it already was); refactoring
    quiqui_rig.gd (427) inside a review pass is a separate story
- gate: release-branch (Phase 4 ship of fix/e07-postepic-review)
  decision: used the PR flow (gh pr create, squash merge PR 33) instead of
    scripts/land-branch.sh solo-local, then confirmed main CI green and the v0.9.1
    patch tag
  reason: state.yaml open_decisions records that this repo lands through PRs with
    a required check gate (branch protection rulesets 403 on this private repo),
    and the run brief named the PR path explicitly
- gate: preflight L5c (version drift after the v0.9.1 patch release)
  decision: fixed by running scripts/sync-project-version.sh (project.godot 0.9.0
    to 0.9.1) and landing it as chore(release)
  reason: big-release cuts the patch tag on main but nothing re-syncs project.godot
    for a patch (the epic train pre-bumps at epic close; patches do not), so the
    version sync is the designed follow-up chore (BUG-016 lineage)
decisions:
- id: ADR-001
  summary: Table-driven Fsm (res://scripts/core/fsm.gd) required for all state machines;
    boolean flag clusters banned.
- id: ADR-002
  summary: 1920x1080 canvas_items + expand aspect; 100% Control scene roots (PRESET_FULL_RECT)
    for zero letterbox bars on 4:3 iPad.
- id: ADR-003
  summary: QuiQuiRig separates Control layout box from foot-pivoted Node2D rig and
    layers Outfit under ExpressionOverlay so outfits never hide facial expressions.
- id: ADR-004
  summary: 'Unified TouchDraggable (4 modes: CONSUME_ON_DROP, CONTINUOUS_SCRUB, SNAP_TO_SLOT,
    FREE_PLACEMENT) with device==-1 mouse-echo filtering.'
- id: ADR-005
  summary: Typed SaveData Resource with atomic .tmp rename and mandatory TestReset
    isolation (user://test_progress.json).
- id: ADR-006
  summary: 'Scene-by-Scene Vertical Slicing: Every epic (e01..e11) ends with at least
    one bootable, playable, end-to-end tested scene.'
- id: ADR-007
  summary: Centralised CI/CD (one self-contained workflow, ci-lint -> test -> verify
    -> build -> export -> release) and big-release for the version ladder.
- id: ADR-008
  summary: Edge-anchored responsive composition — anchors are canvas ratios, offsets
    are absolute pixels; GeometryOracle asserts the painted character, not the box.
- id: ADR-009
  summary: 'Care cycle: money is owned once by CareLoopManager (per-session ledger,
    no persisted guard); the celebration holds and shows the reward (BUG-031), the
    missing bedtime voice line, rig dressing outside the closet and the per-scene
    helper twins are recorded decisions, not silent gaps.'
