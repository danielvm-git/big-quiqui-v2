out_of_scope:
  - item: "Android APK / Google Play packaging"
    reason: "Deferred to v2.0 per user preference (MVP is iPad-first)."
  - item: "16 legacy painterly secondary animals (aguia, avestruz, buffalo, etc.)"
    reason: "Excluded to preserve 100% glossy candy visual coherence; MVP includes only the 3 glossy friends (Pato, Urso, Pinguim)."
  - item: "Online leaderboards, cloud saves, telemetry, or in-app purchases"
    reason: "Strictly forbidden by product charter, LGPD Art. 14, and Apple Kids Category."
  - item: "Text-based tutorials or dialog boxes"
    reason: "Target audience is pre-readers (ages 4–7); all guidance is visual + PT-BR voice."

constraints:
  engine: "Godot 4.7 (GDScript strict typing)"
  viewport: "1920x1080 canvas_items with expand aspect (supports 16:9 and 4:3 iPad 2048x1536 with 0 letterbox bars)"
  performance: "60 fps on iPad, <3.0s cold start, <200 MB package size, 0 orphan nodes"
  privacy: "100% offline, local-only JSONL logs with PII redaction"

success_criteria:
  - "Every epic (e01..e11) ends with a runnable, playable scene verified by automated GUT + TouchSim + GeometryOracle tests."
  - "Zero letterbox bars and zero out-of-hull foam/target drift at both 1920x1080 and 2048x1536."
  - "Outfits and all 14 facial expressions render simultaneously on QuiQuiRig without overwriting each other."
  - "500-step MBT random walk and 1,000-event 3-finger Monkey test complete with 0 engine errors and 0 stuck states."

references:
