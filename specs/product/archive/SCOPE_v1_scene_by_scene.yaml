# story: e01s01
feature_name: "Coelinha QuiQui v1.0 — Greenfield TutoTOONS Vertical Rebuild"
core_value: >
  A crash-free, race-free, TutoTOONS-grade iPad & desktop kids game built scene-by-scene on explicit
  state machines, where every epic delivers a complete playable scene on a rock-solid foundation.

summary: |
  Coelinha QuiQui v1.0 rebuilds the entire game from scratch in a clean repository (/Users/danielvm/Developer/big-quiqui-v2)
  using the 100 curated glossy candy-colored art assets and 35 family/studio Brazilian Portuguese audio files.
  Instead of retrofitting three conflicting legacy generations, this greenfield architecture enforces explicit
  table-driven FSMs (Fsm), 100% Control-anchored responsive scenes under stretch/aspect="expand" (zero letterbox
  bars on 4:3 iPad and 16:9 displays), a layered QuiQuiRig where outfits and facial expressions compose cleanly,
  and a unified TouchDraggable component that filters synthesized mouse-echo events (device == -1).

  Work is sliced vertically scene by scene across 11 epics (e01–e11). Finishing e01 delivers the complete
  engineering harness AND the first playable scene (TitleScene). Each subsequent epic adds one playable scene
  (Casa, Cozinha, Banheiro, Closet, Jardim, Quarto/Celebracao, Vila/Roda, Mercado/Casinha/Festa, Amigos/Album)
  verified end-to-end by GUT, TouchSim, FsmProbe, and GeometryOracle.

