# story: e06s03
# Actions are pinned to 40-char SHAs (enforced by scripts/ci-lint.sh), which means a
# security fix in an action never arrives on its own. Dependabot opens the SHA bump
# and the human review sees the diff; that is the only way pinning stays honest.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["ci", "dependencies"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps)"
    labels: ["ci", "dependencies"]
