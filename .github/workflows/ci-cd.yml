# story: e01s01
name: Test Build Release

# Portfolio CI/CD — Option B of danielvm-git/.github discussion #32:
# this file is a COPY of the central template
#   danielvm-git/.github/.github/workflows/test-build-release-godot.yml
#   (v4.4.0, sha b48b6e004b29a429b53458fed463d0d4b47e6386)
# with the workflow_call inputs inlined for this repository.
#
# Why a copy and not `uses:` (ADR-007): invoking the reusable workflow cross-repo
# from this private repository produced a startup failure with 0 jobs and no
# diagnostic (actionlint is clean on both files). The guide sanctions the copy
# path for exactly this case. Re-sync from the template when the upstream version
# changes; the behaviour below is the template's, not a local invention.
#
# Inherited guarantees:
#   - `test` runs this project's own scripts/preflight.sh (lint, format, strict
#     typing, GUT, PII audit, trace, spec schema) — the gate lives in the repo
#   - `build` emits deploy-meta.json (single-build boundary artifact) on ubuntu
#   - the macOS `export` job runs in parallel and attaches its bundle afterwards,
#     so a macOS queue delay can never delay a version
#   - a feat/fix/perf commit that produces no tag fails the run

on:
  push:
    # `epic/**` gets the full gate too: stories land on the epic branch, and a
    # broken story must be visible there, not only when the epic merges to main.
    # Releases still only run on main (the `release` job checks the ref).
    branches: [main, "epic/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs, never an in-flight release on main.
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  # CI9: cancel superseded runs. A release run gets its own lock (see the release
  # job) so this can never abort a half-published version.
  cancel-in-progress: true

# CI13: least privilege by default; jobs widen it explicitly (`contents: write` only
# on the release job).
permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.0"
  PROJECT_DIR: "game"
  APP_TYPE: "godot"
  EXPORT_PATH: "build/ios/quiqui.ipa"

jobs:
  ci-lint:
    # wire-ci's hard gate: a pipeline that cannot be validated locally breaks every
    # cycle. `scripts/ci-lint.sh` is the same check that runs in preflight L6, so a
    # workflow edit is caught before it ever reaches a runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev tooling (PyYAML for ci-lint)
        run: pip install -r requirements-dev.txt

      - name: Workflow structure (pinning, permissions, timeouts, concurrency)
        run: bash scripts/ci-lint.sh

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling (gdlint, gdformat, PyYAML)
        run: pip install -r requirements-dev.txt

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6  # v2.4.0
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Gate (project preflight)
        run: |
          FLAGS=""
          if ! find "$PROJECT_DIR/tests" -name 'test_*.gd' 2>/dev/null | grep -q .; then
            FLAGS="--bootstrap"
            echo "::warning title=Zero-Test Guard pending::no $PROJECT_DIR/tests/**/test_*.gd yet — running the one-time --bootstrap gate. e01s01 removes this warning permanently."
          fi
          bash scripts/preflight.sh $FLAGS

  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [ci-lint, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Conventional Commits
        run: |
          BASE="origin/main"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE=$(git rev-list --max-parents=0 HEAD)
          git log "$BASE"..HEAD --format=%s | while IFS= read -r line; do
            case "$line" in Merge*) continue ;; esac
            echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: " \
              || { echo "FAIL: Non-conventional commit: $line"; exit 1; }
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        run: |
          BASE="origin/main"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE=$(git rev-list --max-parents=0 HEAD)
          if git log "$BASE"..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

      - name: Offline-only guard (no network APIs in game code)
        run: |
          if grep -RInE '\b(HTTPRequest|HTTPClient|WebSocketPeer|TCPServer|StreamPeerTCP|UDPServer|PacketPeerUDP|ENetMultiplayerPeer)\b' \
              "$PROJECT_DIR/scripts" "$PROJECT_DIR/components" "$PROJECT_DIR/scenes" 2>/dev/null; then
            echo "FATAL: network API detected in an offline game"
            exit 1
          fi
          echo "OK: no network APIs"

  build:
    needs: [ci-lint, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Write deploy-meta
        run: |
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg app_type "$APP_TYPE" \
            '{sha: $sha, ref: $ref, app_type: $app_type}' > deploy-meta.json
          cat deploy-meta.json

      - name: Upload deploy-meta artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: deploy-meta
          path: deploy-meta.json
          retention-days: 3
          if-no-files-found: error

  export-preset:
    # Cheap ubuntu job that answers "is there an iOS preset yet?" so the macOS job
    # below can be skipped instead of reserved-and-cancelled. A step-level gate is
    # not enough: it still asks GitHub for a macOS runner to discover there is
    # nothing to do, which costs a macOS minute per run and turns every PR red when
    # the macOS pool is unavailable (2026-11-05: 0 steps acquired, 9 consecutive runs).
    needs: [test]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.preset.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect export preset
        id: preset
        run: |
          if grep -q 'name="iOS"' game/export_presets.cfg 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS export skipped::game/export_presets.cfg has no iOS preset yet (arrives with e11)."
          fi

  export:
    # Self-enables at e11 when game/export_presets.cfg gains an iOS preset.
    needs: [ci-lint, test, export-preset]
    if: needs.export-preset.outputs.enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect export preset
        id: preset
        run: |
          if grep -q 'name="iOS"' game/export_presets.cfg 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS export skipped::game/export_presets.cfg has no iOS preset yet (arrives with e11)."
          fi

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6  # v2.4.0
        if: steps.preset.outputs.enabled == 'true'
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Export iOS
        if: steps.preset.outputs.enabled == 'true'
        run: |
          mkdir -p "$(dirname "$EXPORT_PATH")"
          godot --headless --path "$PROJECT_DIR" --import
          godot --headless --path "$PROJECT_DIR" --export-release "iOS" "$PWD/$EXPORT_PATH"
          if [ ! -f "$EXPORT_PATH" ] && [ -d "build/ios/quiqui.xcodeproj" ]; then
            echo "Packaging iOS project into $EXPORT_PATH..."
            xcodebuild -project build/ios/quiqui.xcodeproj -target quiqui -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" OTHER_LDFLAGS="\$(inherited) -framework QuartzCore -framework Metal -Wl,-undefined,dynamic_lookup" clean build
            mkdir -p build/ios/Payload
            cp -r build/ios/build/Release-iphoneos/quiqui.app build/ios/Payload/
            (cd build/ios && zip -q -r quiqui.ipa Payload && rm -rf Payload)
          fi
          ls -lh "$EXPORT_PATH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.preset.outputs.enabled == 'true'
        with:
          name: godot-export
          path: ${{ env.EXPORT_PATH }}
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, build]
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the release job pushes the tag: this is the one checkout that keeps the token
          fetch-depth: 0
          persist-credentials: true

      - name: Sync project.godot version with the tag
        run: bash scripts/sync-project-version.sh --check

      - name: Install big-release
        run: |
          curl -sSL https://github.com/danielvm-git/big-release/releases/latest/download/big-release-linux-amd64 -o big-release
          chmod +x big-release
          sudo mv big-release /usr/local/bin/
          big-release health

      - name: Validate release config
        run: big-release validate

      - name: Run big-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: big-release-bot
          GIT_AUTHOR_EMAIL: big-release-bot@danielvm-git.github.io
          GIT_COMMITTER_NAME: big-release-bot
          GIT_COMMITTER_EMAIL: big-release-bot@danielvm-git.github.io
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          SUBJECT=$(git log -1 --format=%s)
          echo "head: $SUBJECT"
          big-release release --verbose
          # big-release creates the tag through the GitHub API, so the local ref only
          # exists after a fetch — without this the guard reads a stale tag and cries
          # failure on a release that actually published.
          git fetch --tags --quiet origin || true
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          echo "tag before=$BEFORE after=$AFTER"
          HEAD_SHA=$(git rev-parse HEAD)
          AFTER_SHA=$(git rev-list -n1 "$AFTER" 2>/dev/null || echo none)
          # A releasable commit must be released: either a new tag appeared, or the
          # newest tag already points at this commit (a re-run of an already released
          # merge). Anything else is the silent no-op this guard exists for.
          if [ "$BEFORE" = "$AFTER" ] && [ "$AFTER_SHA" != "$HEAD_SHA" ] \
             && printf '%s' "$SUBJECT" | grep -qE '^(feat|fix|perf)(\(.+\))?!?: '; then
            echo "FATAL: releasable commit produced no new tag (head $HEAD_SHA, tag $AFTER at $AFTER_SHA)"
            exit 1
          fi
          echo "OK: release step honest"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: godot-export
          path: build/ios
        continue-on-error: true

      - name: Attach export to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$EXPORT_PATH" ]; then
            echo "no export artifact yet (iOS preset arrives with e11) — nothing to attach"
            exit 0
          fi
          TAG=$(git tag --sort=-v:refname | head -1)
          test -n "$TAG" || { echo "no release tag to attach to"; exit 1; }
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$EXPORT_PATH" --clobber
              exit 0
            fi
            echo "release $TAG not published yet (attempt $i) — waiting 30s"
            sleep 30
          done
          echo "FATAL: release $TAG never appeared"
          exit 1
