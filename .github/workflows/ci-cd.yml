# story: e01s01
name: CI/CD

# Thin consumer of the portfolio's centralized CI/CD layer
# (danielvm-git/.github discussion #32). No pipeline logic lives here: the
# reusable Godot workflow owns gate -> verify -> build -> release, so all 28
# repos stay in sync from one source.
#
# Replaces a ~200-line bespoke workflow. Two behaviours it inherits:
#   - release never waits on a macOS runner (the export job runs in parallel)
#   - a releasable commit that produces no tag fails the run

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs, never an in-flight release on main.
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: danielvm-git/.github/.github/workflows/test-build-release-godot.yml@main
    with:
      project_dir: game
      godot_version: "4.7.0"
      release_tool: big-release
      # e01s01 flips this to false: it lets scripts/preflight.sh run its one-time
      # zero-test bootstrap gate while game/tests holds no test_*.gd yet.
      bootstrap_gate: true
      # Empty until e11 adds an iOS preset to game/export_presets.cfg. Setting
      # export_preset: "iOS" then turns on the macOS export job, which attaches
      # the build to the release after big-release publishes it.
      export_preset: ""
      export_path: "build/ios/quiqui.ipa"
    secrets: inherit
